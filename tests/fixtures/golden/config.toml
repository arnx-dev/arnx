consent_at = "2026-10-10T12:00:00+00:00"
telemetry = false   # true: send anonymous usage counts, never code or file names

[models]
reviewer = "anthropic:claude-sonnet-5-5"      # reviews the change, writes and runs the tests
setup = "anthropic:claude-sonnet-5-5"         # sets up the test environment
hunter = "anthropic:claude-haiku-5-5"         # looks at each part of a big change
# second_hunter = "openai:gpt-6.1-sol"        # harness; needs OPENAI_API_KEY
challenger = "anthropic:claude-sonnet-5-5"    # second opinion on each finding
# challenger = "river:zai-org/GLM-5.3-Flash"  # harness; needs RIVER_API_KEY
# challenger_fallback = "openai:gpt-6.1-sol"  # harness; needs OPENAI_API_KEY
answer_model = "anthropic:claude-haiku-5-5"   # turns your answers into tests
effort = "medium"                             # low, medium or high

[budget]            # the most a run may spend, in USD; it stops there
review_usd = 3.0
setup_usd = 3.0
answer_usd = 0.5
setup_minutes = 40                # minutes setup may take, its proof included

[review]
runs = 3                          # each test runs 3 times; a finding fails every time
max_questions = 5                 # questions you are asked, at most
before_check = true               # rerun failing tests on the code before the change
accepted_tests_dir = "tests/arnx" # path accepted tests run from; kept in .arnx/tests/

[cloud]
models = false                                       # true: arnx models instead of your own keys
tests = false                                        # arnx tests (not available yet): tests run in Docker here
effort = "medium"                                    # low, medium or high: the brain's tier

# USD per million tokens: input, output, cache read, cache write
[prices]
"some-model" = [1.0, 2.0, 0.1, 0.0]

# Other providers arnx knows; each copies the Anthropic or OpenAI API.
# To use one: export its key, uncomment its table if it is commented, name it in [models].

