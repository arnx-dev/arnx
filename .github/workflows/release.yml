# On a version tag (v0.1.1): test, build the Node package and standalone binaries for macOS (Apple silicon, Intel)
# and Linux (x64, arm64), stage @arnx-dev/arnx on npmjs.com, and attach the binaries to a GitHub release. The tag must
# match the version in package.json. The package is staged with provenance through npm trusted publishing (no token):
# it is installable only once a maintainer approves it with 2FA (npmjs.com, Staged Packages, or `npm stage approve`).
# Nothing runs outside arnx-dev/arnx, so a fork that pushes a tag publishes nothing.
# A version with a pre-release part (0.2.0-rc.1) gets the npm dist-tag `next` and a pre-release GitHub release:
# `latest` and releases/latest/download/ move only on plain versions.
name: release
on:
  push:
    tags: ["v*"]
permissions:
  contents: read
jobs:
  release:
    if: github.repository == 'arnx-dev/arnx'
    runs-on: ubuntu-latest
    permissions:
      contents: write   # the GitHub release
      id-token: write   # npm trusted publishing and provenance
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.9
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          registry-url: https://registry.npmjs.org
      - name: npm 11.15.0 or later, for staged publishing
        run: npm install -g npm@11.21.1
      - name: Tag matches package.json
        run: test "v$(node -p 'require("./package.json").version')" = "$GITHUB_REF_NAME"
      - run: bun install --frozen-lockfile
      - run: bun run typecheck
      - run: bun test
      - name: Build the Node package and the binaries
        run: |
          sh scripts/build.sh node
          for t in darwin-arm64 darwin-x64 linux-x64 linux-arm64; do
            sh scripts/build.sh bin "bun-$t" "dist/arnx-$t"
          done
          node dist/cli.js --version
          (cd dist && sha256sum arnx-* > SHA256SUMS)
      - name: Stage @arnx-dev/arnx on npmjs.com (published once approved)
        run: |
          npm stage publish --provenance --access public \
            --tag "$(case "$GITHUB_REF_NAME" in *-*) echo next ;; *) echo latest ;; esac)"
      - name: GitHub release with the binaries
        run: |
          gh release create "$GITHUB_REF_NAME" dist/arnx-darwin-arm64 dist/arnx-darwin-x64 dist/arnx-linux-x64 \
            dist/arnx-linux-arm64 dist/SHA256SUMS --title "arnx $GITHUB_REF_NAME" \
            $(case "$GITHUB_REF_NAME" in *-*) echo --prerelease ;; esac) --generate-notes
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
